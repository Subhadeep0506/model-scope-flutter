org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# nobodywho 4.0.0 points `jniLibs.srcDirs` at `layout.buildDirectory.dir("jniLibs")`,
# a Provider<Directory>, which AGP 9 rejects outright. Its warning — that a Provider's
# task dependency is no longer carried — does not bite here: the package wires the
# producer by hand, `afterEvaluate { tasks.matching { merge*JniLibFolders }
# .configureEach { dependsOn(resolveNativeLibraries) } }`, so the .so files are still
# resolved before packaging. Revisit when nobodywho moves to the Variant API.
android.sourceset.disallowProvider=false
