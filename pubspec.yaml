name: model_scope_flutter
description: "A new Flutter project."
publish_to: "none"

version: 0.0.1+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  nobodywho: ^4.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  google_fonts: ^9.0.0
  path_provider: ^2.1.6
  intl: ^0.20.3
  json_annotation: ^4.12.0
  file_picker: ^13.1.0
  uuid: ^4.6.0
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  background_downloader: ^9.6.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.14.1
  build_runner: ^2.16.1
  checks: ^0.3.2
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  # The catalog manifest only — it names the models the app offers and is a few
  # kilobytes. The weights themselves are downloaded from Hugging Face at
  # runtime through Settings rather than bundled; see assets/models/README.md.
  assets:
    - assets/catalog/models.json
